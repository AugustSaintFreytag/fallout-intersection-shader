[Main]
bEnabled=1

[Blend]
; Terrain within this camera distance gets blended (game units, 4096 = ~58 m).
fMaxDistance=4096
; Height above the terrain over which statics fade into it (game units, 24 = ~35 cm).
fBlendRange=24
; How far behind a surface, along the view ray, terrain may lie and still blend onto it (game units, 128 = ~1.8 m).
; Lower values stop terrain from far behind an object showing through it, but shorten the blend at shallow view angles.
fMaxRayGap=128

[Selection]
; Base form types whose references blend with terrain, comma separated.
; Supported: STAT, SCOL, MSTT, ACTI, CONT, DOOR, FURN
sTerrainBlendTypes=STAT

[TerrainBlendBlacklist]
; Base forms that never blend with terrain, one per line as Plugin.esm:FormID.
; The load order byte of the form ID is ignored, so IDs copied from xEdit work as they are.
;FalloutNV.esm:0012ABCD

[Debug]
; 0 = off
; 1 = depth bands: tints the scene by linearized depth with a line every 128 units, up to fMaxDistance
; 2 = overlay mask: draws the terrain overlay in magenta, at its blend opacity
; 3 = stencil tags: tints every pixel of a static that is selected for terrain blending in cyan.
;     Also draws the overlay mask as in mode 2, which shows as purple where it overlaps the tags.
iDebugMode=0
