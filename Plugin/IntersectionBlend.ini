[Main]
bEnabled=1
; Limits the overlay to the statics selected below. Off: the overlay also covers grass, actors and terrain bumps. For testing.
bStencilTags=1

[Blend]
; Camera distance up to which terrain blends, in game units (4096 = ~58 m).
fMaxDistance=4096
; Distance up a static's surface from the ground over which it fades into the terrain, in game units (48 = ~70 cm).
fBlendRange=48
; How far behind a surface along the view ray the terrain drawn over it may lie, in game units (128 = ~1.8 m).
; That terrain supplies the texture mix. Terrain further away shows the wrong ground, such as a cliff behind a crest.
fMaxRayGap=128
; Shades the overlay as the terrain right under the static. The ground then rises onto the static.
; Off: shades the terrain behind the static. For testing.
bLipping=1
; With lipping: on steep faces, continues the ground past the contact line by the height above it.
; The ground looks bent up onto the static. Off: samples the ground straight below. The texture smears upwards on steep faces.
bUnrolledMapping=1
; Experimental: shades the overlay from the landscape block under each static instead of the terrain behind it.
; Replaces bLipping and fMaxRayGap while on and uses bUnrolledMapping. Debug mode 2 then shows a colour per block.
bGroundShading=0

[Selection]
; Base form types whose references blend with terrain, comma separated.
; Supported: STAT, SCOL, MSTT, ACTI, CONT, DOOR, FURN
sTerrainBlendTypes=STAT

[TerrainBlendBlacklist]
; Base forms that never blend with terrain, one per line as Plugin.esm:FormID.
; The load order byte of the form ID is ignored. IDs copied from xEdit work as they are.
;FalloutNV.esm:0012ABCD

[Debug]
; 0 = off
; 1 = depth bands: tints the scene by linearized depth with a line every 128 units, up to fMaxDistance
; 2 = overlay mask: draws the terrain overlay in magenta at its blend opacity
; 3 = stencil tags: tints every pixel of a static selected for terrain blending in cyan.
;     The overlay mask from mode 2 is drawn on top.
; 4 = ground height: height of every surface above the terrain under it. Terrain should be plain green.
;     Objects show a yellow line every 8 units from where they meet the ground. Red is below the ground.
;     Blue means the height field has no terrain there yet.
; 5-7 need bGroundShading. They replace the overlay on statics selected for terrain blending:
; 5 = vertex colour of the ground under the static
; 6 = strongest texture of the ground under the static: slot 1-7 as red, green, blue, yellow, cyan, magenta, white.
;     Darker where the blend weights add up to less than 1.
; 7 = vertex colour as in mode 5, without the packing the overlay uses
iDebugMode=0
; Log the GPU time of every Intersection Blend stage to IntersectionBlend.log every 5 seconds.
; Off: no timing queries are issued.
bProfile=0
