[Main]
; Master switch for all injected passes.
bEnabled=1

; Key that turns all blending on and off in game, as a Windows virtual-key code (121 = F10). 0 = no key.
; Codes: https://learn.microsoft.com/windows/win32/inputdev/virtual-key-codes
iToggleKey=121

[Blend]
; Max camera distance for all terrain and static blending, in game units (4096 = ~58 m).
fMaxDistance=4096

; Range to blend terrain with statics, in game units (48 = ~70 cm).
fBlendRange=32

; Factor on fBlendRange for faces at right angles to the ground, from 0 to 1 (0.5 = climbs half as high).
; Faces parallel to the ground always get full blend range. Faces orthogonal (normal) to ground get this.
fBlendRangeOrthoFactor=0.25

; Base form types to allow for blending with terrain (comma separated list).
; Untested with any moveable statics, I suggest you do not touch this.
; Supported: STAT, SCOL, MSTT, ACTI, CONT, DOOR, FURN
sBlendTypesTerrainToStatic=STAT, SCOL

; Corrects UVs on blending slopes.
; On steep faces, continues the ground past the contact line, as if it bent up onto the static.
; When disabled, samples the ground straight below and stretches/repeats it to paint the slope.
bUnrolledMapping=1

[StaticBlend]
; Max height above the floor for topper edges to get roughened, in game units (6 = ~9 cm). 
; Use 0 to disable static to static blending.
fCropHeight=6

; Size of the edge roughening along static edges, in game units (8 = ~11 cm).
fCropScale=8

[Debug]
; 0 = off
; 1 = depth bands: tints the scene by linearized depth with a line every 128 units, up to fMaxDistance
; 2 = overlay mask: draws the terrain overlay in a colour per landscape block at its blend opacity
; 3 = stencil tags: tints every pixel of a static selected for terrain blending in cyan.
;     The overlay mask from mode 2 is drawn on top.
; 4 = ground height: height of every surface above the terrain under it. Terrain should be plain green.
;     Objects show a yellow line every 8 units from where they meet the ground. Red is below the ground.
;     Blue means the height field has no terrain there yet. The overlay is off in this mode.
; 5-7 replace the overlay on statics selected for terrain blending:
; 5 = vertex colour of the ground under the static
; 6 = strongest texture of the ground under the static: slot 1-7 as red, green, blue, yellow, cyan, magenta, white.
;     Darker where the blend weights add up to less than 1.
; 7 = vertex colour as in mode 5, without the packing the overlay uses
; 8 = topper tags: tints every pixel of a topper from [StaticToStaticWhitelist] in IntersectionBlendForms.ini orange
; 9 = topper crop: paints the pixels the crop cuts away from toppers in red
; 10 = topper crop causes: paints every pixel where a topper lies in front of a base.
;      Red cropped, green floor above the crop height, blue not a floor, yellow equal depths.
;      Toppers draw wrong in this mode.
iDebugMode=0

; Log measured GPU and CPU time to log file (every 5 seconds).
bProfile=1

; Draw toppers after the opaque stage, for static to static blending.
; When disabled, toppers draw with the rest of the scene and do not blend with statics.
bDeferToppers=1
