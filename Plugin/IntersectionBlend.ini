[Main]
; Master switch for all injected passes.
bEnabled=1

; Key that turns all blending on and off in game, as a Windows virtual-key code (121 = F10). 0 = no key.
; Codes: https://learn.microsoft.com/windows/win32/inputdev/virtual-key-codes
iToggleKey=121

; Key that reads the blend, edge, crop and debug settings in this file again in game (122 = F11). 0 = no key.
; Other settings need a restart.
iReloadKey=122

[Blend]
; Max camera distance for all terrain and static blending, in game units (4096 = ~58 m).
fMaxDistance=4096

; Range to blend terrain with statics, in game units (48 = ~70 cm).
fBlendRange=36

; Highest the terrain blend climbs above the ground, in game units (12 = ~17 cm).
; Keeps poles and trees from blending far up. Near-flat surfaces keep the full fBlendRange.
fBlendClimbHeight=4

; Base form types to allow for blending with terrain (comma separated list).
; Untested with any moveable statics, I suggest you do not touch this.
; Supported: STAT, SCOL, MSTT, ACTI, CONT, DOOR, FURN
sBlendTypesTerrainToStatic=STAT, SCOL

; Corrects UVs on blending slopes.
; On steep faces, continues the ground past the contact line, as if it bent up onto the static.
; When disabled, samples the ground straight below and stretches/repeats it to paint the slope.
bUnrolledMapping=1

[StaticBlend]
; Height above the floor over which toppers fade into it, in game units (6 = ~9 cm). 0 turns it off.
; Uses fEdgeSoftness, fContactShadow and fContactShadowWidth from [Edge].
fStaticBlendRange=4

; Factor on fContactShadow for toppers, from 0 to 1 (1). Toppers also get the game's AO at their real contact.
fStaticContactShadowFactor=0.75

[Edge]
; Softness of the blend edge for terrain and toppers, from 0 (hard) to 1 (fades over the whole range) (0.5).
fEdgeSoftness=0.25

; How far raised features of the texture, such as pebbles, stay past the fade and gaps drop out first,
; from 0 to 2 (0.75). Terrain and toppers. Uses the parallax heights of Parallax Shaders, else texture brightness.
fEdgeFeatureStrength=1.0

; Size over which features stand out from the ground texture height, in game units (12 = ~17 cm). Terrain only.
; Larger values pick up larger rocks, smaller values only small pebbles.
fEdgeFeatureSize=18

; Darkening of the surface where the blend meets it, as a contact shadow, from 0 (off) to 1 (black) (0.4).
; Match it to the ambient occlusion or the vertex colour shading of statics.
fContactShadow=0.35

; Share of the blend range the contact shadow fades out over, past the edge, from 0.05 to 0.5 (0.25).
fContactShadowWidth=0.5

[Debug]
; 0 = off
; 1 = depth bands: tints the scene by linearized depth with a line every 128 units, up to fMaxDistance
; 2 = overlay mask: draws the terrain overlay in a colour per landscape block at its blend opacity
; 3 = stencil tags: tints every pixel of a static selected for terrain blending in cyan.
;     The overlay mask from mode 2 is drawn on top.
; 4 = ground height: height of every surface above the terrain under it. Terrain should be plain green.
;     Objects show a yellow line every 8 units from where they meet the ground. Red is below the ground.
;     Blue means the height field has no terrain there yet. The overlay is off in this mode.
; 5-7 replace the overlay on statics selected for terrain blending:
; 5 = vertex colour of the ground under the static
; 6 = strongest texture of the ground under the static: slot 1-7 as red, green, blue, yellow, cyan, magenta, white.
;     Darker where the blend weights add up to less than 1.
; 7 = vertex colour as in mode 5, without the packing the overlay uses
; 8 = topper tags: tints every pixel of a topper from [StaticToStaticWhitelist] in IntersectionBlendForms.ini orange
; 9 = topper blend: paints the floor colour that fades in over the foot of toppers in red
; 10 = topper blend causes: paints every pixel where a topper lies in front of a base.
;      Red blends, green floor above fStaticBlendRange, blue not a floor, yellow equal depths.
; 11 = edge features: draws the texture features of the terrain and topper edges over their blend bands.
;      Grey is neutral, bright pebbles stay longest, dark gaps drop out first.
iDebugMode=0

; Log measured GPU and CPU time to log file (every 5 seconds).
bProfile=1

; Draw toppers after the opaque stage, for static to static blending.
; When disabled, toppers draw with the rest of the scene and do not blend with statics.
bDeferToppers=1
